server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança (T029). Declarados só no nível do server: um `add_header` dentro de
    # um `location` anula todos os do nível acima, então não repita `add_header` nos locations.
    # CSP: tudo da mesma origem (fontes Roboto/Material Symbols são locais, via @fontsource).
    # `style-src 'unsafe-inline'` é necessário ao Angular/Material (estilos de componente e atributos
    # style); scripts ficam restritos a 'self' (o build de produção não injeta script inline:
    # `inlineCritical: false` em angular.json).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # HSTS: o navegador só o respeita sobre HTTPS (TLS é terminado no proxy à frente do nginx).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Mesma origem: o front chama /api e /mcp sem CORS.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /mcp {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Respostas em streaming (SSE) do transporte MCP.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Assets com hash no nome: cache longo.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback; index e service worker sempre revalidados.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
