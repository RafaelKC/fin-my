<figure class="grafico" data-testid="grafico" role="figure" [attr.aria-label]="descricao()">
  @if (comGrafico) {
    <z-chart
      class="desenho h-72 aspect-auto"
      zType="bar"
      zXAxisKey="mes"
      [zData]="dados()"
      [zConfig]="config"
      [zSeries]="series"
      [zYAxis]="true"
      [zYAxisFormatter]="eixo"
      [zAccessibility]="false"
      aria-hidden="true"
    >
      <z-chart-tooltip zIndicator="dot" [zValueFormatter]="dica" />
      <z-chart-legend />
    </z-chart>
  }
  <ul class="meses" [class.so-leitor]="comGrafico">
    @for (p of pontos(); track p.rotulo) {
      <li data-testid="grafico-mes">
        <strong>{{ p.rotulo }}</strong>: entradas {{ brl(p.entradasCents) }}, saídas
        {{ brl(p.saidasCents) }}, saldo final {{ brl(p.saldoCents) }}
      </li>
    }
  </ul>
</figure>
