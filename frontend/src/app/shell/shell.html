<header class="topo">
  <a class="marca" routerLink="/mes" aria-label="Fin-My, ir para o mês">
    <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
      <rect width="512" height="512" rx="112" fill="url(#logo-fundo)" />
      <defs>
        <linearGradient id="logo-fundo" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5b4ff0" />
          <stop offset="1" stop-color="#2a8f8a" />
        </linearGradient>
      </defs>
      <g fill="#fff">
        <rect x="132" y="282" width="56" height="102" rx="28" opacity=".72" />
        <rect x="228" y="214" width="56" height="170" rx="28" opacity=".86" />
        <rect x="324" y="146" width="56" height="238" rx="28" />
      </g>
      <circle cx="160" cy="196" r="30" fill="#ffd166" />
    </svg>
    <span class="marca-nome">Fin-My</span>
  </a>
  <span class="espaco" data-testid="nome-do-espaco">{{ espaco()?.name }}</span>
  <button
    type="button"
    z-button
    zType="ghost"
    zSize="icon"
    class="tema"
    data-testid="alternar-tema"
    [attr.aria-label]="rotuloTema()"
    [title]="rotuloTema()"
    (click)="alternarTema()"
  >
    <app-icone [nome]="iconeTema()" />
  </button>
</header>

<nav class="menu" aria-label="Principal">
  @for (item of navegacao.esquerda(); track item.id) {
    <a
      class="item"
      [routerLink]="item.rota"
      routerLinkActive="ativo"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: false }"
      [attr.data-menu]="item.id"
    >
      <app-icone [nome]="item.icone" />
      <span>{{ item.rotulo }}</span>
    </a>
  }
  <button type="button" class="item lancar" data-testid="lancar" (click)="lancar()">
    <span class="lancar-circulo" aria-hidden="true"><app-icone nome="add" tamanho="1.5rem" /></span>
    <span class="lancar-rotulo">Lançar</span>
  </button>
  @for (item of navegacao.direita(); track item.id) {
    <a
      class="item"
      [routerLink]="item.rota"
      routerLinkActive="ativo"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: false }"
      [attr.data-menu]="item.id"
    >
      <app-icone [nome]="item.icone" />
      <span>{{ item.rotulo }}</span>
    </a>
  }

  <div class="mais" [class.aberto]="maisAberto()" routerLinkActive="mais-ativo">
    <button
      type="button"
      class="item mais-botao"
      data-testid="mais"
      aria-controls="mais-painel"
      [attr.aria-expanded]="maisAberto()"
      (click)="alternarMais()"
    >
      <app-icone nome="more_horiz" />
      <span>Mais</span>
    </button>
    @if (maisAberto()) {
      <div class="mais-fundo" aria-hidden="true" (click)="maisAberto.set(false)"></div>
    }
    <div class="mais-painel" id="mais-painel">
      <span class="mais-titulo" aria-hidden="true">Mais opções</span>
      @for (item of navegacao.mais(); track item.id) {
        <a
          class="item"
          [routerLink]="item.rota"
          routerLinkActive="ativo"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <app-icone [nome]="item.icone" />
          <span>{{ item.rotulo }}</span>
        </a>
      }
    </div>
  </div>
</nav>

<main class="conteudo">
  <router-outlet />
</main>
