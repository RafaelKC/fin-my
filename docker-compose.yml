# Compose base (produção / ponta a ponta). Variáveis vêm do `.env` (veja `.env.example`).
# Em desenvolvimento: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  db:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Aplica as migrações (dotnet FinMy.Api.dll migrate) e termina; a `api` só sobe depois.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Default: ${ConnectionStrings__Default:?defina ConnectionStrings__Default no .env}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: ${ConnectionStrings__Default:?defina ConnectionStrings__Default no .env}
      Jwt__SigningKey: ${Jwt__SigningKey:?defina Jwt__SigningKey no .env}
      Email__Host: ${Email__Host:-mailpit}
      Email__Port: ${Email__Port:-1025}
      Email__User: ${Email__User:-}
      Email__Password: ${Email__Password:-}
      Email__UseTls: ${Email__UseTls:-false}
      Email__FromAddress: ${Email__FromAddress:-no-reply@finmy.local}
      Email__FromName: ${Email__FromName:-Fin-My}
      APP_URL: ${APP_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
